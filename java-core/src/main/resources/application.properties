# Spring
spring.application.name=java-core

# PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres:5432/ecommerce
spring.datasource.username=ecommerce_user
spring.datasource.password=${JWT_SECRET}
spring.datasource.hikari.maximum-pool-size=10

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# Redis Streams
redis.stream.name=order_events

# Outbox
outbox.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=java-core

# Logging
spring.application.log.level=info
management.logging.pattern.level-file=%5p [%t] %c{2} (%F:%L) %m%n