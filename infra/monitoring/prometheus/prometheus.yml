# Prometheus Configuration for E-commerce Empire
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "java-core"
    static_configs:
      - targets: ["java-core:8080"]
        labels:
          environment: "production"
    metrics_path: "/actuator/prometheus"
    scheme: http

  - job_name: "node-realtime"
    static_configs:
      - targets: ["node-realtime:3000"]
        labels:
          environment: "production"
    metrics_path: "/actuator/prometheus"
    scheme: http

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres:9100"]
    labels:
      environment: "production"

  - job_name: "mongodb-exporter"
    static_configs:
      - targets: ["mongo:9100"]
    labels:
      environment: "production"

  - job_name: "minio-exporter"
    static_configs:
      - targets: ["minio:9000"]
    labels:
      environment: "production"

  - job_name: "node-system"
    static_configs:
      - targets: ["node-exporter:9100"]
    labels:
      environment: "production"