version: "3.8"

services:
  ## ============================================
  ## Prometheus - Scrapes metrics from all services
  ## ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/prometheus
    scrape_configs:
      - job_name: "java-core"
        static_configs:
          - targets: ["java-core:8080"]
        metrics_path: "/actuator/prometheus"
        scheme: http
      - job_name: "node-realtime"
        static_configs:
          - targets: ["node-realtime:3000"]
        metrics_path: "/actuator/prometheus"
        scheme: http
      - job_name: "postgres-exporter"
        static_configs:
          - targets: ["postgres:9100"]
      - job_name: "mongodb-exporter"
        static_configs:
          - targets: ["mongo:9100"]

  ## ============================================
  ## Grafana - Visualization dashboard
  ## ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=natanaelcosta95-grafana-clock-panel
    depends_on:
      - prometheus
    volumes:
      - ./grafana-dashboard:/etc/grafana/provisioning/dashboards

  ## ============================================
  ## Uptime Kuma - Free uptime monitoring
  ## ============================================
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    ports:
      - "3001:3001"
    environment:
      - DB_SQLITE_FILE=/data/uptime.db
    volumes:
      - uptime-kuma-data:/data

  ## ============================================
  ## Loki + Promtail - Log aggregation
  ## ============================================
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/log:/var/log:ro
      - ./loki-config:/etc/promtail
    command: -config.file=/etc/promtail/promtail.yml

  ## ============================================
  ## MinIO Exporter - MinIO metrics for Prometheus
  ## ============================================
  minio-exporter:
    image: minio/minio-exporter:latest
    container_name: minio-exporter
    ports:
      - "9222:9222"
    environment:
      - MINIO_EXPORTER_ADDRESS=:9000
      - MINIO_EXPORTER_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_EXPORTER_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    depends_on:
      - minio

  ## ============================================
  ## Node Exporter - System metrics
  ## ============================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ./custom-config:/etc/node-exporter:ro

volumes:
  uptime-kuma-data: