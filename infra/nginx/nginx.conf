events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

    upstream java-core {
        server java-core:8080;
    }

    upstream node-realtime {
        server node-realtime:3000;
    }

    upstream tileserver {
        server tileserver:8080;
    }

    upstream osrm {
        server osrm:5000;
    }

    server {
        listen 80;
        listen 443 ssl;

        location /api/java/ {
            proxy_pass http://java-core;
            limit_req zone=api;
        }

        location /api/node/ {
            proxy_pass http://node-realtime;
            limit_req zone=api;
        }

        location /tiles/ {
            proxy_pass http://tileserver;
        }

        location /route/ {
            proxy_pass http://osrm;
            limit_req zone=api;
        }

        location / {
            proxy_pass http://java-core;
        }
    }
}