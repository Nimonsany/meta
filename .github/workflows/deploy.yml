name: Deploy to DigitalOcean Droplet

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest

        env:
            DROPLET_IP: ${{ secrets.DROPLET_IP }}
            SSH_KEY: ${{ secrets.SSH_KEY }}
            DOCKER_COMPOSE_FILE: "docker-compose.yml"

    steps:
        ## ============================================
        ## 1. Verify secrets
        ## ============================================
        - name: Validate deployment secrets
          run: |
              if [ -z "$DROPLET_IP" ]; then
                  echo "❌ DROPLET_IP secret not set"
                  exit 1
              fi
              if [ -z "$SSH_KEY" ]; then
                  echo "❌ SSH_KEY secret not set"
                  exit 1
              fi
              echo "✅ Secrets validated"

        ## ============================================
        ## 2. Write SSH key and test connection
        ## ============================================
        - name: Write SSH key to temp file
          run: |
              echo "$SSH_KEY" > /tmp/deploy_key
              chmod 600 /tmp/deploy_key

        - name: Test SSH connection
          run: |
              ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key deploy@$DROPLET_IP "echo 'SSH connection OK'"

        ## ============================================
        ## 3. Deploy to droplet
        ## ============================================
        - name: Deploy application
          run: |
              ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key deploy@$DROPLET_IP << 'EOF'
                  set -e
                  
                  echo "📥 Pulling latest code..."
                  cd /opt/ecommerce-empire
                  git pull origin main
                  
                  echo "🐳 Building and starting Java core..."
                  docker compose -f ${DOCKER_COMPOSE_FILE} up -d --build java-core
                  
                  echo "✅ Deployment complete"
                  echo "🔍 Checking service health..."
                  docker compose -f ${DOCKER_COMPOSE_FILE} ps
              EOF

        ## ============================================
        ## 4. Post-deployment verification
        ## ============================================
        - name: Verify deployment
          run: |
              ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key deploy@$DROPLET_IP "
                  curl -s -o /dev/null -w '%{http_code}' http://localhost:80/api/java/auth/login
                  echo ' - Login endpoint status'
                  curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health
                  echo ' - Java core health status'
              "