services:
  postgres: 
    image: postgres:15
    volumes: 
      - pgdata:/var/lib/postgresql/data
  mongo: 
    image: mongo:6
    volumes: 
      - mongodata:/data/db
  redis: 
    image: redis:7-alpine
  meilisearch: 
    image: getmeili/meilisearch
  minio: 
    image: minio/minio
    command: minio server /data --console-address ":9001"
  tileserver: 
    image: maptiler/tileserver-gl
    volumes: 
      - ./infra/tiles/nepal.mbtiles:/data/nepal.mbtiles
  osrm: 
    image: osrm/osrm-backend
    ports: 
      - "5000:5000"
  java-core: 
    build: ./java-core
    ports: 
      - "8080:8080"
    depends_on: 
      - postgres
      - redis
  node-realtime: 
    build: ./node-realtime
    ports: 
      - "3000:3000"
    depends_on: 
      - mongo
      - redis
      - meilisearch
      - minio
  nginx: 
    image: nginx:alpine
    ports: 
      - "80:80"
      - "443:443"
    volumes: 
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
  mongodata: